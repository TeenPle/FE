<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://teenple.app/download">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon.png">
  <link rel="apple-touch-icon" href="../icons/Icon-192.png">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#f4f9ff">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TeenPle">
  <meta property="og:title" content="TeenPle 앱 다운로드">
  <meta property="og:description" content="우리 학교와 동네를 잇는 학생 커뮤니티, TeenPle을 지금 만나보세요.">
  <meta property="og:url" content="https://teenple.app/download">
  <meta property="og:image" content="https://teenple.app/icons/Icon-512.png">

  <title>앱 다운로드 | TeenPle</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #102a56;
      --blue: #1689f8;
      --blue-dark: #0874df;
      --muted: #64748b;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #f4f9ff;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      color: var(--navy);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 13%, rgba(114, 190, 255, 0.3), transparent 26%),
        radial-gradient(circle at 92% 82%, rgba(112, 218, 190, 0.19), transparent 28%),
        linear-gradient(155deg, #fafdff 0%, #edf6ff 54%, #f7fbff 100%);
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    body::before,
    body::after {
      position: fixed;
      z-index: 0;
      border-radius: 999px;
      content: "";
      pointer-events: none;
    }

    body::before {
      top: -88px;
      right: -78px;
      width: 220px;
      height: 220px;
      border: 1px solid rgba(22, 137, 248, 0.13);
      box-shadow:
        0 0 0 30px rgba(255, 255, 255, 0.24),
        0 0 0 62px rgba(22, 137, 248, 0.035);
    }

    body::after {
      bottom: -95px;
      left: -95px;
      width: 230px;
      height: 230px;
      background: rgba(255, 255, 255, 0.5);
      box-shadow: 0 0 60px rgba(22, 137, 248, 0.08);
    }

    main {
      position: relative;
      z-index: 1;
      display: flex;
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding:
        max(48px, env(safe-area-inset-top))
        20px
        max(28px, env(safe-area-inset-bottom));
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      min-width: 0;
      padding: 20px 2px 12px;
      text-align: center;
    }

    .brand-icon {
      display: block;
      width: 94px;
      height: 94px;
      margin: 0 auto 18px;
      border-radius: 25px;
      box-shadow: 0 14px 32px rgba(22, 137, 248, 0.2);
    }

    .account-id {
      margin: 0;
      color: var(--navy);
      font-size: clamp(25px, 7vw, 32px);
      font-weight: 850;
      line-height: 1.08;
      letter-spacing: -0.8px;
    }

    .tagline {
      margin: 12px 0 0;
      color: #426083;
      font-size: 16px;
      font-weight: 650;
      line-height: 1.55;
      letter-spacing: -0.3px;
    }

    .contact {
      margin: 14px 0 25px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .contact a {
      color: var(--blue-dark);
      font-weight: 750;
      text-decoration: none;
    }

    .contact a:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .store-links {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
    }

    .store-link {
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 74px;
      padding: 13px 15px;
      align-items: center;
      gap: 12px;
      border: 1px solid #e2ebf5;
      border-radius: 19px;
      color: #162a46;
      background: #fff;
      box-shadow: 0 7px 20px rgba(43, 88, 140, 0.07);
      text-align: left;
      text-decoration: none;
      transition:
        transform 160ms ease,
        border-color 160ms ease,
        box-shadow 160ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .store-link:hover {
      border-color: #b9d9fb;
      box-shadow: 0 10px 26px rgba(33, 112, 197, 0.12);
      transform: translateY(-2px);
    }

    .store-link:active {
      transform: scale(0.985);
    }

    .store-link:focus-visible {
      outline: 3px solid rgba(22, 137, 248, 0.28);
      outline-offset: 3px;
    }

    .store-icon {
      display: grid;
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      place-items: center;
      border-radius: 14px;
      background: #f3f7fb;
    }

    .store-emoji {
      display: block;
      font-size: 25px;
      line-height: 1;
    }

    .store-copy {
      min-width: 0;
      flex: 1;
    }

    .store-copy small,
    .store-copy strong {
      display: block;
    }

    .store-copy small {
      margin-bottom: 2px;
      color: #718096;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.1px;
    }

    .store-copy strong {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .arrow {
      color: #91a3b8;
      font-size: 22px;
      line-height: 1;
    }

    .footer-links {
      display: flex;
      margin-top: 24px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 9px;
      color: #8a9aae;
      font-size: 12px;
    }

    .footer-links a {
      color: inherit;
      text-decoration: none;
    }

    .footer-links a:hover {
      color: var(--blue-dark);
      text-decoration: underline;
    }

    @media (max-width: 360px) {
      main {
        padding-right: 14px;
        padding-left: 14px;
      }

      .card {
        padding: 14px 0 10px;
      }

      .brand-icon {
        width: 82px;
        height: 82px;
        border-radius: 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .store-link {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="download-title">
      <img
        class="brand-icon"
        src="../icons/Icon-192.png"
        width="94"
        height="94"
        alt="TeenPle 앱 아이콘"
      >
      <h1 class="account-id" id="download-title">@teenple_official</h1>
      <p class="tagline">우리 학교와 동네를 잇는 학생 커뮤니티</p>
      <p class="contact">
        문의하기:
        <a href="mailto:teenple.official@gmail.com?subject=TeenPle%20%EB%AC%B8%EC%9D%98">
          teenple.official@gmail.com
        </a>
      </p>

      <div class="store-links" aria-label="TeenPle 앱 다운로드">
        <a
          class="store-link"
          href="https://apps.apple.com/kr/app/teenple/id6784217699"
          aria-label="App Store에서 TeenPle 다운로드"
        >
          <span class="store-icon" aria-hidden="true">
            <span class="store-emoji">🍎</span>
          </span>
          <span class="store-copy">
            <small>iPhone · iPad</small>
            <strong>App Store에서 다운로드</strong>
          </span>
          <span class="arrow" aria-hidden="true">›</span>
        </a>

        <a
          class="store-link"
          href="https://play.google.com/store/apps/details?id=com.teenple.teenple_frontend"
          aria-label="Google Play에서 TeenPle 다운로드"
        >
          <span class="store-icon" aria-hidden="true">
            <span class="store-emoji">🤖</span>
          </span>
          <span class="store-copy">
            <small>Android</small>
            <strong>Google Play에서 다운로드</strong>
          </span>
          <span class="arrow" aria-hidden="true">›</span>
        </a>
      </div>

      <nav class="footer-links" aria-label="TeenPle 안내">
        <a href="/privacy">개인정보처리방침</a>
        <span aria-hidden="true">·</span>
        <a href="/terms">이용약관</a>
      </nav>
    </section>
  </main>
</body>
</html>
