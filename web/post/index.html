<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#146ef5">
  <meta property="og:title" content="TeenPle 게시글">
  <meta property="og:description" content="TeenPle 앱에서 게시글을 확인해보세요.">
  <meta property="og:url" content="https://teenple.app/post">
  <title>TeenPle 게시글</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f9fc;
      --surface: #ffffff;
      --text: #17202a;
      --muted: #5f6b7a;
      --line: #dfe6ef;
      --accent: #146ef5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      word-break: keep-all;
    }
    main {
      width: min(100%, 420px);
      padding: 28px 22px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(20, 40, 80, 0.06);
      text-align: center;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.3;
      letter-spacing: 0;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .actions {
      display: grid;
      gap: 10px;
      margin-top: 22px;
    }
    a {
      display: block;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
    }
    a.primary {
      border-color: var(--accent);
      color: #fff;
      background: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>TeenPle 게시글</h1>
    <p>앱이 설치되어 있다면 공유 링크에서 게시글로 바로 이동합니다. 앱이 없다면 스토어에서 TeenPle을 설치한 뒤 다시 열어주세요.</p>
    <div class="actions">
      <a class="primary" href="https://play.google.com/store/apps/details?id=com.teenple.teenple_frontend">Google Play에서 보기</a>
      <a href="https://apps.apple.com/app/id6784217699">App Store에서 보기</a>
      <a href="/">TeenPle 안내로 이동</a>
    </div>
  </main>
</body>
</html>
